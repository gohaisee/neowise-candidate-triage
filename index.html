<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body {
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #fff;
      color: #1a1a1a;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; color: inherit; background: #fff; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { margin-top: 1rem; }
    #topic { font-weight: 600; }
    #draft { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite">
    <p id="notice"></p>
    <p id="topic"></p>
    <p id="draft"></p>
  </section>
  <script type="module" src="/screen.mjs"></script>
</body>
</html>
